[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "s3dol"
version = "0.1.14"
description = "s3 (through boto3) with a simple (dict-like or list-like) interface"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = [
    "s3",
    "boto3",
    "aws",
    "storage",
    "key-value",
    "dol",
]
authors = [
    { name = "Thor Whalen" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # A hard floor, not a preference (ADR-0006 §3's upstream policy: raise the
    # floor the day each fix lands, and delete the local workaround in the same
    # commit). v1 needs dol.inner_most_key exported (0.3.62), content_url
    # resolving keys through the wrapper chain (0.3.62), and filesys
    # is_valid_key fixed — all shipped by 0.3.63.
    "dol>=0.3.63",
    "boto3",
    # ADR-0012: the endpoint env vars (AWS_ENDPOINT_URL_S3 / AWS_ENDPOINT_URL) do not exist
    # before botocore 1.31, and ADR-0003 §3's checksum knobs
    # (request_checksum_calculation / response_checksum_validation) arrive in 1.36. s3dol sets
    # them on every client, so an older botocore silently ignores them.
    "botocore>=1.36",
    # ADR-0003 §3: the aws-chunked framing fix on the transfer path.
    "s3transfer>=0.11.2",
]

[project.urls]
Homepage = "https://github.com/i2mint/s3dol"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "moto[s3]>=5.0",
    # conformance assertion 2b fetches a presigned URL; moto patches
    # `requests` but NOT urllib (which would leave the machine). Declared
    # explicitly rather than relied on transitively via moto[s3].
    "requests",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "moto[s3]>=5.0",
    "requests",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "s3dol",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = "s3dol"

[tool.wads.ci.install]
extras = "dev"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]
AWS_ACCESS_KEY_ID = "test"
AWS_SECRET_ACCESS_KEY = "test"
AWS_DEFAULT_REGION = "us-east-1"

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
    # Every documented example is executable against the in-memory fake, so
    # doctests run in the default gate (ADR-0008).
    "--doctest-modules",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = false

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
